# /etc/zenit/zenit.conf — konfiguracja menedżera zenitd (wszystkie wpisy opcjonalne)
[Manager]
#DefaultTarget=multi-user.target
#DefaultTimeoutStartSec=90s
#DefaultTimeoutStopSec=90s
#DefaultRestartSec=100ms
#DefaultStartLimitIntervalSec=10s
#DefaultStartLimitBurst=5
#ShutdownTimeoutSec=120s
#DefaultEnvironment=LANG=pl_PL.UTF-8
#DefaultLimitNOFILE=1024:524288
#CtrlAltDelUnit=reboot.target
#LogLevel=6
#LogMaxFileSize=16M
#LogKeepFiles=4
# Czytaj też jednostki z katalogów systemd (/usr/lib/systemd/system, /etc/systemd/system)
#SystemdUnitCompat=yes
# Utwórz /run/systemd/system — niektóre programy wykrywają po nim „system uruchomiony przez systemd”.
# Domyślnie wyłączone: zenitd NIE implementuje D-Bus org.freedesktop.systemd1.
#CompatSdBooted=no
